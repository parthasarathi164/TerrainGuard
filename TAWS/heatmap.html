<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terrain Guard - 2D Math Analytics</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background-color: #111; color: #eee; display: flex; height: 100vh; padding-top: 45px; box-sizing: border-box; }
        nav { position: absolute; top: 0; left: 0; width: 100%; background: #0f0f14; padding: 12px 20px; z-index: 100; border-bottom: 1px solid #333; display: flex; gap: 20px; box-sizing: border-box; }
        nav a { color: #aaa; text-decoration: none; transition: 0.2s; }
        nav a:hover { color: white; }
        
        #left-panel { width: 35%; background: #1a1a24; border-right: 1px solid #333; display: flex; flex-direction: column; padding: 20px; box-sizing: border-box; overflow-y: auto; }
        #right-panel { width: 65%; display: flex; justify-content: center; align-items: center; background: #000; padding: 20px; box-sizing: border-box; }
        
        .control-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 0.85rem; color: #aaa; font-weight: bold; }
        input[type="file"], input[type="number"], button { width: 100%; padding: 8px; box-sizing: border-box; background: #222; color: white; border: 1px solid #444; border-radius: 4px; }
        .coord-inputs { display: flex; gap: 10px; }
        button { background: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%); font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:disabled { background: #444; color: #888; cursor: not-allowed; }
        
        #math-output { margin-top: 20px; background: #0f0f14; padding: 15px; border-radius: 6px; border: 1px solid #333; font-family: monospace; font-size: 0.85rem; color: #0f0; overflow-y: auto; flex-grow: 1; white-space: pre-wrap; }
        
        canvas { background: #222; box-shadow: 0 0 20px rgba(0,0,0,0.8); border: 2px solid #444; max-width: 100%; max-height: 100%; object-fit: contain; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/geotiff"></script>
</head>
<body>
    <nav>
        <span style="color: white; font-weight: bold; margin-right: 20px;">Terrain Guard OS</span>
        <a href="index.html">3D Flight Simulator</a>
        <a href="heatmap.html" style="color: #00d2ff; font-weight: bold;">2D Algorithmic Analytics</a>
    </nav>

    <div id="left-panel">
        <h2 style="margin-top: 0; color: #00d2ff; font-size: 1.3rem;">Pathfinding Math Engine</h2>
        
        <div class="control-group">
            <label>1. Upload Terrain Data (.tif)</label>
            <input type="file" id="file-upload" accept=".tif,.tiff">
        </div>
        <div class="control-group">
            <label>2. Coordinates (Start X,Z | End X,Z)</label>
            <div class="coord-inputs">
                <input type="number" id="sx" value="10" title="Start X"> <input type="number" id="sz" value="10" title="Start Z">
                <input type="number" id="ex" value="110" title="End X"> <input type="number" id="ez" value="110" title="End Z">
            </div>
        </div>
        <div class="control-group">
            <label>3. Max Flight Ceiling (Meters)</label>
            <input type="number" id="max-height" value="8000" step="100">
        </div>
        
        <button id="btn-run" disabled>Calculate & Visualize TTCI Matrix</button>

        <div id="math-output">Awaiting Data...</div>
    </div>

    <div id="right-panel">
        <canvas id="heatmap-canvas" width="800" height="800"></canvas>
    </div>

    <script type="module" src="heatmap_controller.js"></script>
</body>
</html>
