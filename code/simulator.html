<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terrain Guard - 3D UAS Routing Simulator</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #111; color: #eee; }
        #ui-panel {
            position: absolute; top: 20px; left: 20px; width: 320px;
            background: rgba(15, 15, 20, 0.9); padding: 20px; border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5); z-index: 10; border: 1px solid #333;
            max-height: 90vh; overflow-y: auto;
        }
        h2 { margin-top: 0; font-size: 1.3rem; color: #00d2ff; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .control-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 0.85rem; color: #aaa; font-weight: bold; }
        input[type="file"], input[type="number"], input[type="range"], select { width: 100%; padding: 8px; box-sizing: border-box; background: #222; color: white; border: 1px solid #444; border-radius: 4px; }
        input[type="range"] { padding: 0; cursor: pointer; }
        .coord-inputs { display: flex; gap: 10px; }
        button { 
            width: 100%; padding: 12px; background: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%); 
            color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 1rem; cursor: pointer; margin-top: 10px;
        }
        button:hover { background: linear-gradient(135deg, #3a7bd5 0%, #00d2ff 100%); }
        button:disabled { background: #444; color: #888; cursor: not-allowed; }
        #status-log { 
            margin-top: 15px; padding: 10px; background: #000; border-radius: 6px; 
            font-family: monospace; font-size: 0.85rem; min-height: 80px; color: #0f0; border-left: 3px solid #00d2ff;
        }
        .error { color: #ff4b4b !important; border-left-color: #ff4b4b !important; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* New CSS for Status Bar */
        #status-bar {
            position: absolute;
            bottom: 15px;
            right: 20px;
            background: rgba(15, 15, 20, 0.9);
            color: #00d2ff;
            padding: 8px 15px;
            border-radius: 6px;
            border: 1px solid #333;
            font-family: monospace;
            font-size: 0.95rem;
            z-index: 10;
            pointer-events: none; /* Let clicks pass through to the canvas */
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/geotiff"></script>
</head>
<body>

    <div id="ui-panel">
        <h2>UAS Corridor Risk Scorer</h2>
        
        <div class="control-group">
            <label>1. Upload Terrain Data (.tif)</label>
            <input type="file" id="file-upload" accept=".tif,.tiff">
        </div>

        <div class="control-group">
            <label>2. Terrain Color Template</label>
            <select id="theme-select">
                <option value="traffic-light">Aviation Traffic Light</option>
                <option value="magma">Magma Risk Profile</option>
                <option value="jet">Jet Spectrum (Blue to Red)</option>
                <option value="grayscale">Grayscale Risk Profile</option>
            </select>
        </div>

        <div class="control-group">
            <label>3. Terrain Opacity: <span id="opacity-val">0.50</span></label>
            <input type="range" id="terrain-opacity" min="0.1" max="1.0" step="0.05" value="0.50">
        </div>

        <div class="control-group">
            <label>4. Start Point (Grid X, Z: 0 to 127)</label>
            <div class="coord-inputs">
                <input type="number" id="start-x" value="10" min="0" max="127" placeholder="X">
                <input type="number" id="start-z" value="10" min="0" max="127" placeholder="Z">
            </div>
        </div>

        <div class="control-group">
            <label>5. Target Destination (Grid X, Z: 0 to 127)</label>
            <div class="coord-inputs">
                <input type="number" id="end-x" value="110" min="0" max="127" placeholder="X">
                <input type="number" id="end-z" value="110" min="0" max="127" placeholder="Z">
            </div>
        </div>

        <div class="control-group">
            <label>6. Max Flight Ceiling (Meters)</label>
            <input type="number" id="max-height" value="8000" step="100">
        </div>

        <button id="btn-start" disabled>Run Simulation</button>

        <div id="status-log">Awaiting DEM Upload...</div>
    </div>

    <div id="status-bar">Hover: --</div>

    <div id="canvas-container"></div>

    <script>
        // --- FORCE DEFAULTS ON LOAD TO OVERRIDE BROWSER CACHE ---
        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById('theme-select').value = 'grayscale';
            document.getElementById('terrain-opacity').value = 0.50;
            document.getElementById('opacity-val').innerText = "0.50";
        });

        // --- SYSTEM CONSTANTS & GLOBALS ---
        const GRID_RES = 128; 
        const PLANE_SIZE = 100;
        let terrainHeights = new Float32Array(GRID_RES * GRID_RES);
        let tciScores = new Float32Array(GRID_RES * GRID_RES);
        let minEl = 0, maxEl = 0;
        
        // 3D Objects
        let scene, camera, renderer, controls;
        let terrainMesh, pathLine, straightLine, startMarker, endMarker, drone;
        let axisLabelsGroup;
        let animationPath = [];
        let animIndex = 0;
        
        // View Cube & Raycasting Globals
        let cubeScene, cubeCamera, cubeMesh;
        let targetCameraPos = null;
        const mainRaycaster = new THREE.Raycaster();
        const cubeRaycaster = new THREE.Raycaster();
        const mouseVector = new THREE.Vector2();

        function logStatus(msg, type="normal") {
            const logEl = document.getElementById('status-log');
            logEl.innerHTML = msg;
            logEl.className = type;
        }

        // --- View Cube Texture Helper ---
        function getCubeFaceTexture(text, bgColor) {
            const canvas = document.createElement('canvas');
            canvas.width = 128; canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = bgColor;
            ctx.fillRect(0,0,128,128);
            ctx.strokeStyle = '#222';
            ctx.lineWidth = 6;
            ctx.strokeRect(0,0,128,128);
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 26px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, 64, 64);
            return new THREE.CanvasTexture(canvas);
        }

        // --- 1. INITIALIZE THREE.JS ---
        function init3D() {
            const container = document.getElementById('canvas-container');
            
            // Main Scene Setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a24);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 80, 100);

            // Crucial: autoClear false to allow overlaying the View Cube
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.autoClear = false; 
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(100, 150, 50);
            scene.add(dirLight);

            // Base Grid & Axes
            const gridHelper = new THREE.GridHelper(PLANE_SIZE, 32, 0x444444, 0x222222);
            gridHelper.position.y = -5;
            scene.add(gridHelper);

            const axesHelper = new THREE.AxesHelper(PLANE_SIZE / 2 + 10);
            axesHelper.position.set(-PLANE_SIZE / 2, -5, -PLANE_SIZE / 2);
            scene.add(axesHelper);

            axisLabelsGroup = new THREE.Group();
            scene.add(axisLabelsGroup);

            // --- Secondary View Cube Scene Setup ---
            cubeScene = new THREE.Scene();
            cubeCamera = new THREE.PerspectiveCamera(50, 1, 0.1, 10);
            
            const materials = [
                new THREE.MeshBasicMaterial({map: getCubeFaceTexture('RIGHT', '#9e2a2b')}),  // +x
                new THREE.MeshBasicMaterial({map: getCubeFaceTexture('LEFT', '#9e2a2b')}),   // -x
                new THREE.MeshBasicMaterial({map: getCubeFaceTexture('TOP', '#3a5a40')}),    // +y
                new THREE.MeshBasicMaterial({map: getCubeFaceTexture('BTM', '#3a5a40')}),    // -y
                new THREE.MeshBasicMaterial({map: getCubeFaceTexture('FRONT', '#1d3557')}),  // +z
                new THREE.MeshBasicMaterial({map: getCubeFaceTexture('BACK', '#1d3557')})    // -z
            ];
            
            cubeMesh = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), materials);
            cubeScene.add(cubeMesh);

            animate();
        }

        // --- MOUSE INTERACTIONS (Status Bar & View Cube Snapping) ---
        window.addEventListener('mousemove', (e) => {
            if (!terrainMesh) return;
            
            // Map Mouse coordinates for Main Scene Raycasting
            mouseVector.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouseVector.y = -(e.clientY / window.innerHeight) * 2 + 1;
            
            mainRaycaster.setFromCamera(mouseVector, camera);
            const intersects = mainRaycaster.intersectObject(terrainMesh);
            const statusEl = document.getElementById('status-bar');
            
            if (intersects.length > 0) {
                const pt = intersects[0].point;
                // Reverse math to find the grid values and elevation mapped on the fly
                const gridX = Math.round(((pt.x + PLANE_SIZE/2) / PLANE_SIZE) * (GRID_RES - 1));
                const gridZ = Math.round(((pt.z + PLANE_SIZE/2) / PLANE_SIZE) * (GRID_RES - 1));
                
                let elevation = 0;
                if (maxEl !== minEl) {
                    elevation = ((pt.y + 5) / 20) * (maxEl - minEl) + minEl;
                }
                
                if(gridX >= 0 && gridX <= 127 && gridZ >= 0 && gridZ <= 127) {
                    statusEl.innerHTML = `Hover: X: ${gridX} | Z: ${gridZ} | Elev: ${Math.round(elevation)}m`;
                } else {
                    statusEl.innerHTML = `Hover: --`;
                }
            } else {
                statusEl.innerHTML = `Hover: --`;
            }
        });

        window.addEventListener('click', (e) => {
            // View Cube Dimensions & Position 
            const cw = 110, ch = 110;
            const domX = window.innerWidth - cw - 20; 
            const domY = window.innerHeight - ch - 60; // Offset above the Status Bar

            // Check if click was inside the View Cube bounding box
            if (e.clientX >= domX && e.clientX <= domX + cw && e.clientY >= domY && e.clientY <= domY + ch) {
                const localX = ((e.clientX - domX) / cw) * 2 - 1;
                const localY = -((e.clientY - domY) / ch) * 2 + 1;
                
                const cubeMouse = new THREE.Vector2(localX, localY);
                cubeRaycaster.setFromCamera(cubeMouse, cubeCamera);
                const intersects = cubeRaycaster.intersectObject(cubeMesh);
                
                if (intersects.length > 0) {
                    const matIndex = intersects[0].face.materialIndex;
                    const dist = camera.position.distanceTo(controls.target);
                    const offset = new THREE.Vector3();
                    
                    switch(matIndex) {
                        case 0: offset.set(dist, 0, 0); break;       // Right
                        case 1: offset.set(-dist, 0, 0); break;      // Left
                        case 2: offset.set(0.01, dist, 0); break;    // Top (Offset X gently to avoid camera Gimbal Lock)
                        case 3: offset.set(0.01, -dist, 0); break;   // Bottom
                        case 4: offset.set(0, 0, dist); break;       // Front
                        case 5: offset.set(0, 0, -dist); break;      // Back
                    }
                    targetCameraPos = controls.target.clone().add(offset);
                }
            }
        });

        // --- HELPER Function: Canvas Text Textures for Numeric Labels ---
        function createLabelSprite(text, color = '#ffffff', fontSize = '24px') { 
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = 'rgba(0,0,0,0)';
            ctx.fillRect(0, 0, 256, 64);
            
            ctx.font = 'Bold ' + fontSize + ' Arial'; 
            ctx.fillStyle = color;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, 128, 32);

            const texture = new THREE.CanvasTexture(canvas);
            const spriteMaterial = new THREE.SpriteMaterial({ map: texture, transparent: true });
            const sprite = new THREE.Sprite(spriteMaterial);
            sprite.scale.set(8, 2, 1); 
            return sprite;
        }

        function drawAxisNumbers() {
            while(axisLabelsGroup.children.length > 0){
                axisLabelsGroup.remove(axisLabelsGroup.children[0]);
            }

            const stepVal = 5; 
            const minPos = -PLANE_SIZE / 2;

            // X Axis Labels
            for (let x = 0; x <= GRID_RES; x += stepVal) {
                const gridVal = Math.min(x, GRID_RES - 1);
                const pct = x / GRID_RES;
                const wx = minPos + pct * PLANE_SIZE;
                
                const sprite = createLabelSprite(gridVal.toString(), '#ff4444');
                sprite.position.set(wx, -6.5, minPos - 3);
                axisLabelsGroup.add(sprite);
            }

            // Z Axis Labels
            for (let z = 0; z <= GRID_RES; z += stepVal) {
                const gridVal = Math.min(z, GRID_RES - 1);
                const pct = z / GRID_RES;
                const wz = minPos + pct * PLANE_SIZE;
                
                const sprite = createLabelSprite(gridVal.toString(), '#4444ff');
                sprite.position.set(minPos - 3, -6.5, wz);
                axisLabelsGroup.add(sprite);
            }

            // Y Axis Elevation Labels
            const altSteps = 8;
            for (let i = 0; i <= altSteps; i++) {
                const pct = i / altSteps;
                const wy = -5 + (pct * 20); 
                const realMeters = minEl + (pct * (maxEl - minEl));
                
                const sprite = createLabelSprite(Math.round(realMeters) + 'm', '#00ff00');
                sprite.position.set(minPos - 5, wy, minPos - 5);
                axisLabelsGroup.add(sprite);
            }
            
            // Text Titles for Axes
            const xNameSprite = createLabelSprite("X - Longitude", "#ff4444", "26px");
            xNameSprite.position.set(PLANE_SIZE / 2 + 8, -6.5, minPos);
            xNameSprite.scale.set(8, 4, 1); 
            axisLabelsGroup.add(xNameSprite);

            const zNameSprite = createLabelSprite("Z - Latitude", "#4444ff", "26px");
            zNameSprite.position.set(minPos, -6.5, PLANE_SIZE / 2 + 8);
            zNameSprite.scale.set(8, 4, 1);
            axisLabelsGroup.add(zNameSprite);

            const yNameSprite = createLabelSprite("Y - Elevation (m)", "#00ff00", "26px");
            yNameSprite.position.set(minPos - 5, 18, minPos - 5);
            yNameSprite.scale.set(10, 5, 1);
            axisLabelsGroup.add(yNameSprite);
        }

        // --- 2. TERRAIN & TCI GENERATION ---
        document.getElementById('file-upload').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            logStatus("Parsing GeoTIFF... Please wait.");
            
            try {
                const arrayBuffer = await file.arrayBuffer();
                const tiff = await GeoTIFF.fromArrayBuffer(arrayBuffer);
                const image = await tiff.getImage();
                const rasters = await image.readRasters();
                const rawData = rasters[0];
                const width = image.getWidth();
                const height = image.getHeight();

                buildTerrainGrid(rawData, width, height);
                document.getElementById('btn-start').disabled = false;
                logStatus("Terrain Loaded. Ready for Pathfinding.");
            } catch (err) {
                logStatus("Error reading TIFF: " + err.message, "error");
            }
        });

        function buildTerrainGrid(rawData, imgW, imgH) {
            const stepX = Math.floor(imgW / GRID_RES);
            const stepY = Math.floor(imgH / GRID_RES);
            
            minEl = Infinity; maxEl = -Infinity;

            for (let y = 0; y < GRID_RES; y++) {
                for (let x = 0; x < GRID_RES; x++) {
                    const idx = (y * stepY) * imgW + (x * stepX);
                    let val = rawData[idx];
                    if (val < -1000) val = minEl === Infinity ? 0 : minEl; 
                    terrainHeights[y * GRID_RES + x] = val;
                    if (val < minEl) minEl = val;
                    if (val > maxEl) maxEl = val;
                }
            }

            for (let y = 1; y < GRID_RES - 1; y++) {
                for (let x = 1; x < GRID_RES - 1; x++) {
                    const idx = y * GRID_RES + x;
                    const el = terrainHeights[idx];
                    
                    let maxDiff = 0;
                    [[0,1],[1,0],[0,-1],[-1,0]].forEach(d => {
                        const nIdx = (y+d[0]) * GRID_RES + (x+d[1]);
                        maxDiff = Math.max(maxDiff, Math.abs(el - terrainHeights[nIdx]));
                    });
                    
                    tciScores[idx] = Math.min(100, (maxDiff / ((maxEl - minEl)*0.05)) * 100);
                }
            }

            render3DTerrain();
            drawAxisNumbers();
        }

        function render3DTerrain() {
            if(!terrainMesh && !document.getElementById('btn-start').disabled) return; 
            if(terrainMesh) scene.remove(terrainMesh);
            
            const geometry = new THREE.PlaneGeometry(PLANE_SIZE, PLANE_SIZE, GRID_RES - 1, GRID_RES - 1);
            geometry.rotateX(-Math.PI / 2);
            const vertices = geometry.attributes.position.array;
            const colors = [];
            const theme = document.getElementById('theme-select').value;

            for (let i = 0; i < terrainHeights.length; i++) {
                const normalizedHeight = ((terrainHeights[i] - minEl) / (maxEl - minEl)) * 20; 
                vertices[i * 3 + 1] = normalizedHeight;

                const risk = tciScores[i];
                let color = new THREE.Color();
                
                if (theme === "traffic-light") {
                    if (risk > 80) color.setHex(0x990000); 
                    else if (risk > 50) color.setHex(0xff0000); 
                    else if (risk > 30) color.setHex(0xffa500); 
                    else if (risk > 15) color.setHex(0xffff00); 
                    else color.setHex(0x00ff00); 
                } else if (theme === "magma") {
                    const pct = risk / 100.0;
                    if (pct > 0.8) color.setRGB(0.98, 0.3, 0.23);
                    else if (pct > 0.5) color.setRGB(0.72, 0.14, 0.43);
                    else if (pct > 0.3) color.setRGB(0.44, 0.09, 0.49);
                    else color.setRGB(0.05, 0.04, 0.20);
                } else if (theme === "grayscale") {
                    const brightness = 0.1 + (risk / 100.0) * 0.9;
                    color.setRGB(brightness, brightness, brightness);
                } else { 
                    const pct = risk / 100.0;
                    if (pct > 0.8) color.setRGB(1, 0, 0);
                    else if (pct > 0.5) color.setRGB(1, 0.7, 0);
                    else if (pct > 0.3) color.setRGB(0, 1, 0);
                    else color.setRGB(0, 0, 1);
                }
                
                colors.push(color.r, color.g, color.b);
            }

            geometry.computeVertexNormals();
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

            const currentOpacity = parseFloat(document.getElementById('terrain-opacity').value);
            const material = new THREE.MeshLambertMaterial({ 
                vertexColors: true, 
                wireframe: false, 
                side: THREE.DoubleSide,
                transparent: true,
                opacity: currentOpacity
            });

            terrainMesh = new THREE.Mesh(geometry, material);
            terrainMesh.position.y = -5;
            scene.add(terrainMesh);
        }

        document.getElementById('theme-select').addEventListener('change', () => {
            if (terrainHeights[0] !== 0) render3DTerrain(); 
        });

        document.getElementById('terrain-opacity').addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            document.getElementById('opacity-val').innerText = val.toFixed(2);
            if (terrainMesh) {
                terrainMesh.material.opacity = val;
                terrainMesh.material.needsUpdate = true;
            }
        });

        // --- 3. A* PATHFINDING ALGORITHM ---
        document.getElementById('btn-start').addEventListener('click', () => {
            const sx = parseInt(document.getElementById('start-x').value);
            const sz = parseInt(document.getElementById('start-z').value);
            const ex = parseInt(document.getElementById('end-x').value);
            const ez = parseInt(document.getElementById('end-z').value);
            const maxH = parseFloat(document.getElementById('max-height').value);

            if (sx < 0 || sx >= GRID_RES || sz < 0 || sz >= GRID_RES || ex < 0 || ex >= GRID_RES || ez < 0 || ez >= GRID_RES) {
                logStatus("Coordinates must be between 0 and 127.", "error"); return;
            }

            const startIdx = sz * GRID_RES + sx;
            const endIdx = ez * GRID_RES + ex;

            if (terrainHeights[startIdx] > maxH) {
                logStatus(`Error: Start elevation (${terrainHeights[startIdx].toFixed(0)}m) limits payload capability.`, "error"); return;
            }
            if (terrainHeights[endIdx] > maxH) {
                logStatus(`Error: End elevation (${terrainHeights[endIdx].toFixed(0)}m) limits descent parameters.`, "error"); return;
            }

            logStatus("Calculating Shortest Path...");
            drawStraightLine(sx, sz, ex, ez); 

            setTimeout(() => {
                const path = runAStar(sx, sz, ex, ez, maxH);
                if (path) {
                    logStatus("Optimal Safe Corridor Found. Launching Drone Simulation...", "normal");
                    drawPath(path);
                    spawnDrone(path);
                } else {
                    logStatus(`CRITICAL: Destination Unreachable. Terrain peaks block all corridors below ${maxH}m.`, "error");
                }
            }, 100);
        });

        function runAStar(startX, startZ, endX, endZ, maxH) {
            const openSet = [];
            const cameFrom = new Map();
            const gScore = new Map();
            
            const startKey = `${startX},${startZ}`;
            gScore.set(startKey, 0);
            openSet.push({ x: startX, z: startZ, f: getHeuristic(startX, startZ, endX, endZ) });

            while (openSet.length > 0) {
                openSet.sort((a, b) => a.f - b.f);
                const current = openSet.shift();
                const currKey = `${current.x},${current.z}`;

                if (current.x === endX && current.z === endZ) {
                    return reconstructPath(cameFrom, currKey);
                }

                const neighbors = [
                    {x: current.x, z: current.z-1}, {x: current.x, z: current.z+1},
                    {x: current.x-1, z: current.z}, {x: current.x+1, z: current.z},
                    {x: current.x-1, z: current.z-1}, {x: current.x+1, z: current.z+1},
                    {x: current.x-1, z: current.z+1}, {x: current.x+1, z: current.z-1}
                ];

                for (let n of neighbors) {
                    if (n.x < 0 || n.x >= GRID_RES || n.z < 0 || n.z >= GRID_RES) continue;

                    const idx = n.z * GRID_RES + n.x;
                    const elevation = terrainHeights[idx];
                    
                    if (elevation > maxH) continue; 

                    const isDiagonal = (n.x !== current.x && n.z !== current.z);
                    const baseCost = isDiagonal ? 1.414 : 1.0;
                    const riskPenalty = tciScores[idx] > 80 ? 1000 : (tciScores[idx] > 50 ? 15 : 0); 
                    
                    const tentative_g = gScore.get(currKey) + baseCost + riskPenalty;
                    const nKey = `${n.x},${n.z}`;

                    if (!gScore.has(nKey) || tentative_g < gScore.get(nKey)) {
                        cameFrom.set(nKey, current);
                        gScore.set(nKey, tentative_g);
                        const fScore = tentative_g + getHeuristic(n.x, n.z, endX, endZ);
                        openSet.push({ x: n.x, z: n.z, f: fScore });
                    }
                }
            }
            return null; 
        }

        function getHeuristic(x1, z1, x2, z2) {
            return Math.sqrt(Math.pow(x2 - x1, 2) + Math.pow(z2 - z1, 2));
        }

        function reconstructPath(cameFrom, currentKey) {
            const path = [currentKey];
            while (cameFrom.has(currentKey)) {
                const prev = cameFrom.get(currentKey);
                currentKey = `${prev.x},${prev.z}`;
                path.push(currentKey);
            }
            return path.reverse();
        }

        // --- 4. VISUALIZING THE ROUTE & DRONE ---
        function gridToWorld(gx, gz) {
            const wx = (gx / (GRID_RES - 1)) * PLANE_SIZE - (PLANE_SIZE / 2);
            const wz = (gz / (GRID_RES - 1)) * PLANE_SIZE - (PLANE_SIZE / 2);
            const idx = gz * GRID_RES + gx;
            const wy = ((terrainHeights[idx] - minEl) / (maxEl - minEl)) * 20 - 5;
            return new THREE.Vector3(wx, wy + 1.5, wz); 
        }

        function drawStraightLine(sx, sz, ex, ez) {
            if (straightLine) scene.remove(straightLine);
            const material = new THREE.LineDashedMaterial({ color: 0xaaaaaa, dashSize: 1, gapSize: 1 });
            const points = [gridToWorld(sx, sz), gridToWorld(ex, ez)];
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            straightLine = new THREE.Line(geometry, material);
            straightLine.computeLineDistances(); 
            scene.add(straightLine);
        }

        function drawPath(pathArray) {
            if (pathLine) scene.remove(pathLine);
            if (startMarker) scene.remove(startMarker);
            if (endMarker) scene.remove(endMarker);

            animationPath = [];
            const points = [];
            
            pathArray.forEach(str => {
                const parts = str.split(',');
                const vec = gridToWorld(parseInt(parts[0]), parseInt(parts[1]));
                points.push(vec);
                animationPath.push(vec);
            });

            const material = new THREE.LineBasicMaterial({ color: 0x00d2ff, linewidth: 3 });
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            pathLine = new THREE.Line(geometry, material);
            scene.add(pathLine);

            const sGeo = new THREE.SphereGeometry(1);
            const mStart = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
            const mEnd = new THREE.MeshBasicMaterial({ color: 0xff0000 });
            
            startMarker = new THREE.Mesh(sGeo, mStart);
            startMarker.position.copy(points[0]);
            scene.add(startMarker);

            endMarker = new THREE.Mesh(sGeo, mEnd);
            endMarker.position.copy(points[points.length - 1]);
            scene.add(endMarker);
        }

        function spawnDrone(path) {
            if (drone) scene.remove(drone);
            
            const droneGeo = new THREE.BoxGeometry(1.5, 0.4, 1.5);
            const droneMat = new THREE.MeshStandardMaterial({ color: 0x00ffff, emissive: 0x005555 });
            drone = new THREE.Mesh(droneGeo, droneMat);
            
            scene.add(drone);
            animIndex = 0;
        }

        function animate() {
            requestAnimationFrame(animate);

            // Interpolate Camera Snapping from View Cube
            if (targetCameraPos) {
                camera.position.lerp(targetCameraPos, 0.08); // Adjust 0.08 for snapping speed
                if (camera.position.distanceTo(targetCameraPos) < 0.1) {
                    targetCameraPos = null; // Kill loop when arrived
                }
            }

            if (drone && animationPath.length > 0 && animIndex < animationPath.length - 1) {
                const currentPos = animationPath[Math.floor(animIndex)];
                const nextPos = animationPath[Math.floor(animIndex) + 1];
                
                const lerpFactor = animIndex % 1;
                drone.position.lerpVectors(currentPos, nextPos, lerpFactor);
                drone.lookAt(nextPos); 

                animIndex += 0.15; 
                
                if (animIndex >= animationPath.length - 1) {
                    logStatus("Simulation Completed Successfully: Drone cleared risk boundaries.", "normal");
                }
            }

            if(axisLabelsGroup) {
                axisLabelsGroup.children.forEach(label => {
                    label.quaternion.copy(camera.quaternion);
                });
            }

            controls.update();

            // --- MULTI-PASS RENDERING ---
            renderer.clear(); // Manually clear the canvas

            // Pass 1: Render Full Main Scene
            renderer.setViewport(0, 0, window.innerWidth, window.innerHeight);
            renderer.setScissorTest(false);
            renderer.render(scene, camera);

            // Pass 2: Render View Cube overlay in the bottom right corner
            const cw = 110, ch = 110;
            const cx = window.innerWidth - cw - 20;
            const cy = 60; // Pushed up above the status bar

            // Sync Cube Rotation to exactly match User Scene Camera
            cubeCamera.position.copy(camera.position);
            cubeCamera.position.sub(controls.target);
            cubeCamera.position.setLength(2.5); // Fixed visual distance for the HUD cube
            cubeCamera.lookAt(cubeScene.position);

            renderer.setViewport(cx, cy, cw, ch);
            renderer.setScissor(cx, cy, cw, ch);
            renderer.setScissorTest(true);
            renderer.clearDepth(); // Prevent terrain from clipping over the cube
            renderer.render(cubeScene, cubeCamera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        init3D();
    </script>
</body>
