<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terrain Guard - Modular 3D UAS Simulator</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background-color: #111; color: #eee; }
        #ui-panel {
            position: absolute; top: 20px; left: 20px; width: 320px;
            background: rgba(15, 15, 20, 0.9); padding: 20px; border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5); z-index: 10; border: 1px solid #333;
            max-height: 90vh; overflow-y: auto;
        }
        h2 { margin-top: 0; font-size: 1.3rem; color: #00d2ff; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .control-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 0.85rem; color: #aaa; font-weight: bold; }
        input[type="file"], input[type="number"], input[type="range"], select { width: 100%; padding: 8px; box-sizing: border-box; background: #222; color: white; border: 1px solid #444; border-radius: 4px; }
        input[type="range"] { padding: 0; cursor: pointer; }
        .coord-inputs { display: flex; gap: 10px; }
        button { 
            width: 100%; padding: 12px; background: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%); 
            color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 1rem; cursor: pointer; margin-top: 10px;
        }
        button:hover { background: linear-gradient(135deg, #3a7bd5 0%, #00d2ff 100%); }
        button:disabled { background: #444; color: #888; cursor: not-allowed; }
        #status-log { 
            margin-top: 15px; padding: 10px; background: #000; border-radius: 6px; 
            font-family: monospace; font-size: 0.85rem; min-height: 80px; color: #0f0; border-left: 3px solid #00d2ff;
        }
        .error { color: #ff4b4b !important; border-left-color: #ff4b4b !important; }
        #status-bar { position: absolute; bottom: 15px; right: 20px; background: rgba(15, 15, 20, 0.9); color: #00d2ff; padding: 8px 15px; border-radius: 6px; border: 1px solid #333; font-family: monospace; font-size: 0.95rem; z-index: 10; pointer-events: none; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/geotiff"></script>
</head>
<body>

    <div id="ui-panel">
        <h2>UAS Corridor Risk Scorer</h2>
        <div class="control-group">
            <label>1. Upload Terrain Data (.tif)</label>
            <input type="file" id="file-upload" accept=".tif,.tiff">
        </div>
        <div class="control-group">
            <label>2. Terrain Color Template</label>
            <select id="theme-select">
                <option value="traffic-light">Aviation Traffic Light</option>
                <option value="magma">Magma Risk Profile</option>
                <option value="jet">Jet Spectrum (Blue to Red)</option>
                <option value="grayscale" selected>Grayscale Risk Profile</option>
            </select>
        </div>
        <div class="control-group">
            <label>3. Terrain Opacity: <span id="opacity-val">0.50</span></label>
            <input type="range" id="terrain-opacity" min="0.1" max="1.0" step="0.05" value="0.50">
        </div>
        <div class="control-group">
            <label>4. Start Point (Grid X, Z: 0 to 127)</label>
            <div class="coord-inputs">
                <input type="number" id="start-x" value="10" min="0" max="127">
                <input type="number" id="start-z" value="10" min="0" max="127">
            </div>
        </div>
        <div class="control-group">
            <label>5. Target Destination (Grid X, Z: 0 to 127)</label>
            <div class="coord-inputs">
                <input type="number" id="end-x" value="110" min="0" max="127">
                <input type="number" id="end-z" value="110" min="0" max="127">
            </div>
        </div>
        <div class="control-group">
            <label>6. Max Flight Ceiling (Meters)</label>
            <input type="number" id="max-height" value="8000" step="100">
        </div>
        <button id="btn-start" disabled>Run Simulation</button>
        <div id="status-log">Awaiting DEM Upload...</div>
    </div>

    <div id="status-bar">Hover: --</div>
    <div id="canvas-container"></div>

    <script type="module" src="ui_controller.js"></script>
</body>
</html>
